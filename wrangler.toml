# Static Astro site — deploy prebuilt `dist/` (no SSR adapter).
# Cloudflare CI should run: npm run build  →  npx wrangler deploy
# Do NOT use `astro add cloudflare` for this project.

name = "rust-cheat-org"
compatibility_date = "2024-11-03"

[assets]
directory = "./dist"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"

[observability]
enabled = false
